name: Signal Studio release images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish commit-tagged images to this repository's GHCR namespace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.repository != 'umami-software/umami'
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    if: github.repository != 'umami-software/umami'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        target: [runner, worker, migration, hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Repository-owned image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}/signal-studio-${TARGET}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: SIGNAL_STUDIO_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
