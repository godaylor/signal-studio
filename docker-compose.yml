name: signal-studio-transform

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: signal_studio
      POSTGRES_USER: signal_studio
      POSTGRES_PASSWORD: signal_studio
    volumes:
      - signal-studio-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SIGNAL_STUDIO_DB_PORT:-32110}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgresql://signal_studio:signal_studio@db:5432/signal_studio
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: signal-studio:local
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:${SIGNAL_STUDIO_APP_PORT:-32109}:3000"
    environment:
      DATABASE_URL: postgresql://signal_studio:signal_studio@db:5432/signal_studio
      APP_SECRET: ${APP_SECRET:?Run node scripts/generate-env.js before docker compose up}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?Run node scripts/generate-env.js before docker compose up}
      EXPORT_STORAGE_PATH: /app/exports
    volumes:
      - signal-studio-export-data:/app/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: signal-studio-worker:local
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://signal_studio:signal_studio@db:5432/signal_studio
      APP_SECRET: ${APP_SECRET:?Run node scripts/generate-env.js before docker compose up}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?Run node scripts/generate-env.js before docker compose up}
      EXPORT_STORAGE_PATH: /app/exports
    volumes:
      - signal-studio-export-data:/app/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 260s

volumes:
  signal-studio-db-data:
  signal-studio-export-data:
